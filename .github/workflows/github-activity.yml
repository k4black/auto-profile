name: Generate GitHub activity


on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      startDate:
        description: 'Backfill start date (YYYY/MM/DD). Leave empty for incremental mode (read from LAST_UPDATED).'
      endDate:
        description: 'Backfill end date (YYYY/MM/DD). Defaults to today.'


jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Configure git
        run: |
          git config --global user.email "38007247+k4black@users.noreply.github.com"
          git config --global user.name "k4black"

      - name: Checkout activity repository
        uses: actions/checkout@v7
        with:
          repository: k4black/github-activity
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Determine date range
        id: range
        run: |
          END="${{ inputs.endDate }}"
          [ -z "$END" ] && END=$(date +%Y/%m/%d)
          if [ -n "${{ inputs.startDate }}" ]; then
            START="${{ inputs.startDate }}"
            MODE=backfill
          elif [ -f LAST_UPDATED ]; then
            LAST=$(cat LAST_UPDATED)
            START=$(date -d "$LAST + 1 day" +%Y/%m/%d)
            MODE=incremental
          else
            START="2019/06/01"
            MODE=initial
          fi
          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END"    >> $GITHUB_OUTPUT
          echo "mode=$MODE"  >> $GITHUB_OUTPUT
          echo "Range: $START -> $END (mode=$MODE)"

      - name: Generate commits with fake-git-history
        run: |
          npx -y fake-git-history@latest \
            --startDate "${{ steps.range.outputs.start }}" \
            --endDate "${{ steps.range.outputs.end }}" \
            --distribution workHours \
            --frequency 60 \
            --commitsPerDay "0,3"

      - name: Replay commits into activity repo
        run: |
          cd my-history
          # git log is newest-first; reverse so oldest commits land first
          git log --format=%aI > ../dates.txt
          cd ..
          tac dates.txt > dates_rev.txt
          added=0
          while read -r d; do
            [ -z "$d" ] && continue
            printf '%s\n' "$d" > activity.txt
            git add activity.txt
            if GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" \
              git commit --quiet -m "activity"; then
              added=$((added+1))
            fi
          done < dates_rev.txt
          echo "Replayed $added commits from ${{ steps.range.outputs.start }} to ${{ steps.range.outputs.end }}"
          rm -rf my-history dates.txt dates_rev.txt

      - name: Update LAST_UPDATED marker
        run: |
          TODAY=$(date +%Y-%m-%d)
          echo "$TODAY" > LAST_UPDATED
          git add LAST_UPDATED
          NOW=$(date -Iseconds)
          if ! GIT_AUTHOR_DATE="$NOW" GIT_COMMITTER_DATE="$NOW" \
            git diff --cached --quiet; then
            GIT_AUTHOR_DATE="$NOW" GIT_COMMITTER_DATE="$NOW" \
              git commit --quiet -m "chore: update LAST_UPDATED to $TODAY"
          fi

      - name: Push
        run: |
          if [ "${{ steps.range.outputs.mode }}" = "backfill" ] || [ "${{ steps.range.outputs.mode }}" = "initial" ]; then
            git push --force
          else
            git push
          fi
